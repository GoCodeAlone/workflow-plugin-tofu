name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    # ubuntu-latest (GitHub-hosted) because workflow-plugin-tofu is a public
    # repo and the GoCodeAlone org's Default self-hosted runner group has
    # allows_public_repositories=false — the previous [self-hosted, Linux, X64]
    # selector blocked this release job indefinitely. Same precedent +
    # template as workflow-plugin-azure PR #11.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On push-tag, github.ref is refs/tags/<tag>; on workflow_dispatch,
          # check out the requested tag explicitly so re-triggers for stuck
          # tags work without a force-tag dance.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/GoCodeAlone/*
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN || github.token }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            // listReleases returns drafts; getReleaseByTag 404s on drafts. GoReleaser
            // creates releases as draft; this step flips them to non-draft post-publish.
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              throw new Error(`release for tag ${tag} not found in repo listing (latest 100 releases)`);
            }
            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
            }

  notify-workflow-registry:
    name: Notify workflow-registry
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !contains(inputs.tag_name || github.ref_name, '-') }}
    steps:
      - name: Trigger registry manifest sync
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.repo_dispatch_token }}
          repository: GoCodeAlone/workflow-registry
          event-type: plugin-release
          client-payload: '{"plugin": "tofu"}'
