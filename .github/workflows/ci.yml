name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  GOPRIVATE: github.com/GoCodeAlone/*
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Git for private repos
        # Write auth into a job-scoped temp gitconfig so go module fetches
        # (which run git in the module cache, not this repo) also pick it up.
        # GIT_CONFIG_GLOBAL is exported via GITHUB_ENV so all subsequent steps see it.
        run: |
          GITCONFIG="${RUNNER_TEMP}/gitconfig-test"
          git config -f "$GITCONFIG" url."https://x-access-token:${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=${GITCONFIG}" >> $GITHUB_ENV
      - run: go build ./...
      - run: go test ./... -v -count=1
      - run: go vet ./...

  wfctl-strict-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Git for private repos
        # Write auth into a job-scoped temp gitconfig so go module fetches
        # (which run git in the module cache, not this repo) also pick it up.
        # GIT_CONFIG_GLOBAL is exported via GITHUB_ENV so all subsequent steps see it.
        run: |
          GITCONFIG="${RUNNER_TEMP}/gitconfig-wfctl"
          git config -f "$GITCONFIG" url."https://x-access-token:${{ secrets.RELEASES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=${GITCONFIG}" >> $GITHUB_ENV
      - name: Validate strict plugin contracts
        # audit plugins scans the PARENT directory for workflow-plugin-* repos.
        # $GITHUB_WORKSPACE is the repo root (.../workflow-plugin-tofu); its
        # parent directory contains the checked-out workflow-plugin-tofu dir.
        run: go run github.com/GoCodeAlone/workflow/cmd/wfctl@v0.20.1 audit plugins --repo-root "$GITHUB_WORKSPACE/.." --strict-contracts
